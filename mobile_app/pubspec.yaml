publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  http: 1.6.0
  url_launcher: 6.3.2
  flutter_local_notifications: 23.0.4
  timezone: 0.11.2
  flutter_contacts: 2.6.0
  sms_sender: 1.0.7
  permission_handler: 13.0.2
  workmanager: 0.10.10
  shared_preferences: 2.5.6
  intl: 0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
