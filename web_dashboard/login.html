<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to the Employee Tasks dashboard.">
  <title>Sign in · Employee Tasks</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <main class="login-card">
    <div class="brand-icon" aria-hidden="true">✓</div>
    <p class="eyebrow">OFFICE MANAGER</p>
    <h1>Employee Tasks</h1>
    <p class="intro">Sign in to view the daily task dashboard.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" maxlength="128" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
